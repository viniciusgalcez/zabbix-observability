zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 6d0ad8ebaadd459a935330918411756a
      name: 'Templates/Applications'
    - uuid: 387360cb8040458095150a6c060e991f
      name: 'Templates/Roles'
  templates:
    - uuid: acdc547172234d0c948e7b047e294304
      template: 'App Zabbix Agent Availability'
      name: 'App Zabbix Agent Availability'
      description: 'Detecta indisponibilidade do agente/host via simple check na porta 10050 (executado pelo proxy). Base da dependencia anti-tempestade dos demais alertas.'
      groups:
        - name: 'Templates/Applications'
      items:
        - uuid: 19c62a0771714bf387f60e22e2e7ec3d
          name: 'Agente acessivel (porta TCP 10050)'
          type: SIMPLE
          key: 'net.tcp.service[tcp,{HOST.CONN},{$ZBX.AGENT.PORT}]'
          delay: 1m
          value_type: UNSIGNED
          tags:
            - tag: component
              value: 'zabbix-agent'
          triggers:
            - uuid: d033225951b445128cf6bb56f04c0c87
              expression: 'max(/App Zabbix Agent Availability/net.tcp.service[tcp,{HOST.CONN},{$ZBX.AGENT.PORT}],#3)=0'
              name: 'Agente ou host inacessivel em {HOST.NAME}'
              priority: HIGH
              description: 'Porta 10050 do agente inacessivel a partir do proxy: agente parado ou host fora do ar.'
              tags:
                - tag: scope
                  value: availability
      macros:
        - macro: '{$ZBX.AGENT.PORT}'
          value: '10050'
          description: 'Porta TCP do Zabbix agent testada para disponibilidade.'
    - uuid: 9ab1e997ef0b425e9660916beb700ae6
      template: 'App DHCP Server por Zabbix agent'
      name: 'App DHCP Server por Zabbix agent'
      description: 'Disponibilidade via Zabbix Agent. Ajuste o servico na macro {$DHCP.SERVICE} por host se necessario.'
