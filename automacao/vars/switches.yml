---
# ── Credenciais SNMPv3 — padrão único global (definir com Marcos) ─────────────
# Marcos aplica a config SNMPv3 nos switches via SSH em massa antes de rodar o playbook.
# Parâmetros recomendados para CBS350/Catalyst 1200:
#   snmp-server group ZabbixGroup v3 priv
#   snmp-server user zabbix_snmp ZabbixGroup v3 auth sha256 <auth_pass> priv aes <priv_pass>
#
cisco_snmpv3:
  username: "zabbix_snmp"
  auth_passphrase: "ZbxAuth_2026@Net"
  priv_passphrase: "ZbxPriv_2026@Secure"
  auth_protocol: 3                     # 3=SHA256
  priv_protocol: 2                     # 2=AES128
  security_level: 2                    # 2=authPriv

