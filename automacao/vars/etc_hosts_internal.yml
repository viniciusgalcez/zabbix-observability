---
# IPs dos servidores internos com domínio .corp.br.
# Preencher com os IPs reais fornecidos pelo Marcos.
# Executar configure_etc_hosts.yml após preencher.

internal_hosts:
  # Lansweeper: servidor multi-NIC — BGP 172.18.2.49 / SCL 172.16.2.49 / SPO 172.17.2.140
  # HTTPS (443) só está disponível na interface BGP — acessível de todos os sites
  - ip: "172.18.2.49"
    hostname: "lansweeper.capricornio.corp.br"
    descricao: "Lansweeper — inventário de ativos (SCL-SRV-VAPP03)"

  # Node-RED: SCL-SRV-VAPP03 — portas 1880/1881/1882
  - ip: "172.16.100.250"
    hostname: "nodered.capricornio.corp.br"
    descricao: "Node-RED instâncias 1/2/3 (portas 1880/1881/1882)"

  # Cisco Dashboard: SCL-SRV-V04
  - ip: "172.16.2.144"
    hostname: "cisco.capricornio.corp.br"
    descricao: "Cisco Dashboard (SCL-SRV-V04)"

# Bloco gerado automaticamente para o /etc/hosts
# (atualizado pelo playbook a partir da lista acima — não editar diretamente)
internal_hosts_block: |
  {% for h in internal_hosts %}
  {{ h.ip }}  {{ h.hostname }}  # {{ h.descricao }}
  {% endfor %}
