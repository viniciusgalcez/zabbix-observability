---
- name: Instalar unattended-upgrades e apt-listchanges
  ansible.builtin.apt:
    name:
      - unattended-upgrades
      - apt-listchanges
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Configurar origens de segurança (50unattended-upgrades)
  ansible.builtin.template:
    src: 50unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    owner: root
    group: root
    mode: "0644"

- name: Configurar periodicidade de atualizações (20auto-upgrades)
  ansible.builtin.template:
    src: 20auto-upgrades.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"

- name: Habilitar e iniciar serviço unattended-upgrades
  ansible.builtin.service:
    name: unattended-upgrades
    state: started
    enabled: true

- name: Verificar arquivos de configuração presentes
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /etc/apt/apt.conf.d/50unattended-upgrades
    - /etc/apt/apt.conf.d/20auto-upgrades
  register: uu_configs

- name: Confirmar arquivos de configuração existem
  ansible.builtin.assert:
    that: item.stat.exists
    fail_msg: "Arquivo de configuração não encontrado: {{ item.item }}"
  loop: "{{ uu_configs.results }}"
